<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1f3"><title>Wanderly · Your cozy India trip partner</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--rose:#d96686;--pink:#ffe8ed;--ink:#493743;--muted:#856f7b;--cream:#fffaf7;--line:#f0dbe1;--shadow:0 12px 35px #b45a7920}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#fff4f5,#fffdf8);font-family:'DM Sans',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e68aa8;outline-offset:2px}h1,h2,h3{font-family:'Playfair Display',serif;margin:0 0 12px}p{line-height:1.55}.shell{max-width:1160px;margin:auto;padding:22px 24px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 24px}.brand{font-family:'Playfair Display',serif;font-size:31px;color:#bb5478;font-weight:700}.brand span{font-family:'DM Sans',sans-serif;font-size:11px;display:block;letter-spacing:2px;color:#987b85}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.pill{border:0;border-radius:30px;background:white;color:var(--ink);padding:11px 16px}.nav button.active,.primary{background:var(--rose)!important;color:white!important}.primary{border:0;border-radius:30px;padding:13px 21px;font-weight:700}.ghost{background:white;border:1px solid var(--line);border-radius:30px;padding:11px 16px;color:#b95075}.hero{border-radius:32px;min-height:330px;background:linear-gradient(90deg,#542c44c9,#542c4420),url('https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=1400&auto=format&fit=crop') center/cover;display:flex;align-items:center;color:white;padding:44px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(36px,5vw,65px);max-width:600px}.hero p{max-width:470px}.section{margin-top:33px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}.card,.panel{background:#fff;border:1px solid #f6e6e9;border-radius:23px;overflow:hidden;box-shadow:var(--shadow)}.card img{width:100%;height:190px;object-fit:cover}.cardbody{padding:17px}.card h3{margin:0 0 7px}.small{font-size:13px;color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.panel{padding:24px}.search{width:100%;padding:16px 20px;border:1px solid #f1ceda;border-radius:40px;background:#fff}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#fff0f4;color:#b54e73;font-size:12px;margin:4px 4px 4px 0}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid var(--line);border-radius:30px;padding:10px 16px;background:white}.tabs button.on{background:#d96686;color:white}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}input,select,textarea{width:100%;padding:12px;border:1px solid #eacbd5;border-radius:13px;background:#fff;color:var(--ink)}textarea{min-height:100px}.result{background:#fff3f5;border-radius:20px;padding:20px;margin-top:18px}.money{font-size:30px;font-weight:700;color:#b54e73}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{background:#ffe8ee;border-radius:30px;padding:9px 14px;font-size:13px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#503c48;color:white;border-radius:20px;padding:13px 22px;z-index:10}.empty{text-align:center;padding:40px;color:var(--muted)}.bottom{display:none}.note{font-size:12px;color:var(--muted)}.loading{opacity:.6}.quizoptions{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.quizoptions button{border:1px solid var(--line);background:white;padding:18px;border-radius:16px}.quizoptions button.chosen{background:#ffe1ea;border:2px solid var(--rose)}@media(max-width:700px){.shell{padding:13px 13px 100px}.top .nav{display:none}.hero{min-height:320px;padding:25px}.hero h1{font-size:40px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(12px);justify-content:space-around;padding:12px 3px;z-index:8;border-top:1px solid var(--line)}.bottom button{border:0;background:none;color:#a45e78;font-size:12px}.panel{padding:17px}.photo-grid{grid-template-columns:repeat(2,1fr)}}
</style><meta name="theme-color" content="#f8dbe7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Wanderly"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png"><script>if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));</script></head><body><div class="shell"><header class="top"><div class="brand">✿ Wanderly <span>YOUR COMPLETE TRIP PARTNER</span></div><nav class="nav" id="nav"></nav><button class="ghost" onclick="showPage('profile')" id="profileChip">♡ My corner</button></header><main id="app"></main></div><nav class="bottom" id="bottom"></nav><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';const DEST=[
{id:'jaipur',name:'Jaipur',state:'Rajasthan',type:['Culture','City'],desc:'The Pink City: majestic forts, palaces, colorful bazaars and Rajasthani food.',spots:['Amber Fort','Hawa Mahal','City Palace','Jantar Mantar'],food:['Dal baati churma','Ghewar'],image:'https://images.unsplash.com/photo-1599661046827-dacff0c0f09a?w=900&auto=format&fit=crop',daily:2600},
{id:'goa',name:'Goa',state:'Goa',type:['Beach','Adventure'],desc:'Golden beaches, Portuguese heritage, seafood and unforgettable sunsets.',spots:['Baga Beach','Fort Aguada','Basilica of Bom Jesus','Palolem Beach'],food:['Goan fish curry','Bebinca'],image:'https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=900&auto=format&fit=crop',daily:3200},
{id:'munnar',name:'Munnar',state:'Kerala',type:['Nature','Romantic'],desc:'Misty hills, lush tea gardens and peaceful mountain escapes.',spots:['Eravikulam National Park','Tea Museum','Mattupetty Dam','Top Station'],food:['Appam and stew','Kerala sadya'],image:'https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?w=900&auto=format&fit=crop',daily:2900},
{id:'agra',name:'Agra',state:'Uttar Pradesh',type:['Culture','City'],desc:'Discover the Taj Mahal and the remarkable Mughal heritage of Agra.',spots:['Taj Mahal','Agra Fort','Mehtab Bagh','Itmad-ud-Daulah'],food:['Petha','Mughlai cuisine'],image:'https://images.unsplash.com/photo-1564507592333-c60657eea523?w=900&auto=format&fit=crop',daily:2400},
{id:'manali',name:'Manali',state:'Himachal Pradesh',type:['Nature','Adventure'],desc:'Snowy peaks, pine forests, mountain cafes and adventurous trails.',spots:['Solang Valley','Hadimba Temple','Old Manali','Atal Tunnel'],food:['Siddu','Trout'],image:'https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?w=900&auto=format&fit=crop',daily:3000},
{id:'varanasi',name:'Varanasi',state:'Uttar Pradesh',type:['Culture','Spiritual'],desc:'Ancient ghats, riverside rituals, winding lanes and living traditions.',spots:['Dashashwamedh Ghat','Assi Ghat','Sarnath','Kashi Vishwanath Temple'],food:['Kachori sabzi','Banarasi lassi'],image:'https://images.unsplash.com/photo-1561361513-2d000a50f0dc?w=900&auto=format&fit=crop',daily:2200},
{id:'udaipur',name:'Udaipur',state:'Rajasthan',type:['Romantic','Culture'],desc:'Lakeside palaces, romantic sunsets and winding old-city streets.',spots:['City Palace','Lake Pichola','Jag Mandir','Saheliyon Ki Bari'],food:['Gatte ki sabzi','Kachori'],image:'https://images.unsplash.com/photo-1606293926075-69a00dbfde81?w=900&auto=format&fit=crop',daily:3100},
{id:'hampi',name:'Hampi',state:'Karnataka',type:['Culture','Adventure'],desc:'A surreal landscape of ancient temples, boulders and historic ruins.',spots:['Virupaksha Temple','Vittala Temple','Matanga Hill','Lotus Mahal'],food:['South Indian thali','Dosa'],image:'https://images.unsplash.com/photo-1600100397608-f0109d8b6f08?w=900&auto=format&fit=crop',daily:2300}];
const KEY='wanderly-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}}data={name:'',avatar:'🌷',wishlist:[],trips:[],photos:[],...data};let page='home',search='',filter='All',selected=null,quiz={},quizStep=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('Storage is full. Try smaller photos.')}},money=n=>'₹'+Math.round(n).toLocaleString('en-IN'),map=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),toast=s=>{const e=$('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2800)},link=(url,label,cls='ghost')=>`<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none">${esc(label)}</a>`;
function showPage(p){page=p;selected=null;render();window.scrollTo(0,0)}function nav(){const items=[['home','⌂ Home'],['explore','⌕ Explore'],['quiz','✧ Trip quiz'],['trips','▤ My trips'],['gallery','▧ Gallery'],['tools','♧ Tools']];$('#nav').innerHTML=items.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="showPage('${p}')">${t}</button>`).join('');$('#bottom').innerHTML=[['home','⌂ Home'],['explore','⌕ Explore'],['quiz','✧ Quiz'],['trips','▤ Trips'],['gallery','▧ Gallery']].map(([p,t])=>`<button onclick="showPage('${p}')">${t}</button>`).join('');$('#profileChip').textContent=(data.avatar||'🌷')+' '+(data.name||'My corner')}
function destCard(d){return `<article class="card"><img src="${d.image}" alt="${esc(d.name)}" loading="lazy"><div class="cardbody"><div class="row between"><h3>${esc(d.name)}</h3><button class="ghost" aria-label="Save ${esc(d.name)}" onclick="wish('${d.id}')">${data.wishlist.includes(d.id)?'♥':'♡'}</button></div><div class="small">📍 ${esc(d.state)}</div><p>${esc(d.desc)}</p>${d.type.map(t=>`<span class="tag">${t}</span>`).join('')}<div class="row between" style="margin-top:12px"><span class="small">Sample daily budget ${money(d.daily)}</span><button class="primary" onclick="detail('${d.id}')">Explore →</button></div></div></article>`}function wish(id){data.wishlist=data.wishlist.includes(id)?data.wishlist.filter(x=>x!==id):[...data.wishlist,id];save();render();toast(data.wishlist.includes(id)?'Added to wishlist ♥':'Removed from wishlist')}
function home(){return `<section class="hero"><div><span>✧ INDIA IS CALLING ✧</span><h1>Collect moments,<br>not miles.</h1><p>Dream up your perfect Indian escape, discover beautiful places and plan a journey that feels like you.</p><button class="primary" onclick="showPage('quiz')">Plan my dream trip ✨</button></div></section><section class="section"><div class="sectionhead"><h2>Where shall we wander? ♡</h2><button class="ghost" onclick="showPage('explore')">See all →</button></div><div class="grid">${DEST.slice(0,4).map(destCard).join('')}</div></section><section class="section panel"><h2>Made for little adventures & big dreams</h2><div class="grid"><div>🧳 <b>Personalized escapes</b><p>Find places to match your travel style and budget.</p></div><div>🗺️ <b>Route planning</b><p>Open real directions for your journey in Google Maps.</p></div><div>📸 <b>Memory book</b><p>Turn your favorite travel photos into a lovely collage.</p></div></div></section>`}
function explore(){let ds=DEST.filter(d=>(filter==='All'||d.type.includes(filter))&&(`${d.name} ${d.state} ${d.desc} ${d.spots.join(' ')}`).toLowerCase().includes(search.toLowerCase()));return `<h1>Explore India 🌸</h1><p>Find your next beautiful place.</p><input class="search" id="search" placeholder="Explore India — search places, states, landmarks…" value="${esc(search)}" oninput="search=this.value;updateResults()"><div class="tabs">${['All','Nature','Beach','Culture','Adventure','Romantic','City','Spiritual'].map(x=>`<button class="${filter===x?'on':''}" onclick="filter='${x}';updateResults()">${x}</button>`).join('')}</div><div id="results" class="grid">${ds.map(destCard).join('')||'<p>No places found. Try another search.</p>'}</div><p class="note">Curated starter collection; not a complete database of every place in India.</p>`}function updateResults(){let input=$('#search');if(input)search=input.value;$('#results').innerHTML=DEST.filter(d=>(filter==='All'||d.type.includes(filter))&&(`${d.name} ${d.state} ${d.desc} ${d.spots.join(' ')}`).toLowerCase().includes(search.toLowerCase())).map(destCard).join('')||'<p>No places found.</p>';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.textContent===filter))}
function detail(id){selected=DEST.find(d=>d.id===id);page='detail';render();window.scrollTo(0,0)}function detailPage(){let d=selected;if(!d)return explore();return `<button class="ghost" onclick="showPage('explore')">← Explore</button><div class="section hero" style="background-image:linear-gradient(90deg,#542c44aa,#542c4420),url('${d.image}')"><div><h1>${esc(d.name)}</h1><p>${esc(d.state)} · ${d.type.join(' · ')}</p></div></div><section class="section panel"><h2>Meet ${esc(d.name)} ✿</h2><p>${esc(d.desc)}</p><h3>Places to see</h3><div class="grid">${d.spots.map(s=>`<div class="panel"><h3>${esc(s)}</h3>${link(map(s+', '+d.name+', India'),'📍 View on map')}</div>`).join('')}</div><h3 style="margin-top:24px">Local flavors</h3><p>${d.food.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p><p class="note">Place descriptions and indicative budgets are starter content. Confirm hours, fees and local conditions before traveling.</p><div class="row"><button class="primary" onclick="startTrip('${d.id}')">Plan a trip here 🧳</button><button class="ghost" onclick="wish('${d.id}')">${data.wishlist.includes(d.id)?'♥ Saved':'♡ Save'}</button>${link('https://en.wikipedia.org/wiki/'+encodeURIComponent(d.name),'Read more ↗')}</div></section>`}
const QUESTIONS=[['What kind of escape are you dreaming of?',['Nature','Beach','Culture','Adventure','Romantic','Spiritual']],['Who is coming along?',['Solo','Couple','Family','Friends']],['How long will you wander?',['1–3 days','4–7 days','8–14 days','15–30 days','1–3 months']],['Your budget per person?',['Under ₹5,000','₹5,000–₹15,000','₹15,000–₹35,000','₹35,000+']],['Food preference?',['Vegetarian','Non-vegetarian','Both']],['Favorite way to travel?',['Train','Bus','Car','Bike','Flight','Flexible']]];function quizPage(){if(quizStep>=QUESTIONS.length){let matches=DEST.filter(d=>d.type.includes(quiz[0])).sort((a,b)=>a.daily-b.daily);if(!matches.length)matches=DEST.slice(0,3);return `<div class="panel"><h1>Your dreamy matches ✨</h1><p>Based on your ${esc(quiz[0])} preference. These are suggestions, not guaranteed matches.</p><div class="grid">${matches.map(destCard).join('')}</div><div class="row" style="margin-top:20px"><button class="ghost" onclick="quizStep=0;quiz={};render()">Start again</button><button class="primary" onclick="startTrip('${matches[0].id}')">Plan this trip</button></div></div>`}let [q,options]=QUESTIONS[quizStep];return `<div class="panel" style="max-width:730px;margin:30px auto"><span class="tag">Question ${quizStep+1} of ${QUESTIONS.length}</span><div class="steps">${QUESTIONS.map((_,i)=>`<span class="step" style="opacity:${i<=quizStep?1:.35}">${i+1}</span>`).join('')}</div><h1>${q}</h1><div class="quizoptions">${options.map(o=>`<button class="${quiz[quizStep]===o?'chosen':''}" onclick="quiz[${quizStep}]=${JSON.stringify(o).replace(/"/g,'&quot;')};render()">${o}</button>`).join('')}</div><div class="row between" style="margin-top:26px"><button class="ghost" onclick="quizStep=Math.max(0,quizStep-1);render()">← Back</button><button class="primary" ${!quiz[quizStep]?'disabled':''} onclick="quizStep++;render()">${quizStep===QUESTIONS.length-1?'Find my places':'Next →'}</button></div></div>`}
function startTrip(id){page='planner';selected=DEST.find(d=>d.id===id)||null;render();window.scrollTo(0,0)}function planner(){return `<div class="panel"><h1>Plan a little adventure 🧳</h1><p>Customize your trip and receive an editable, indicative budget.</p><form onsubmit="event.preventDefault();makeTrip()" class="formgrid"><div><label>Destination</label><select id="destination" required>${DEST.map(d=>`<option value="${d.id}" ${selected?.id===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div><div><label>Starting city</label><input id="origin" required placeholder="e.g. Kochi" maxlength="100"></div><div><label>Start date</label><input id="date" type="date" required min="${new Date().toISOString().slice(0,10)}"></div><div><label>Days (1–90)</label><input id="days" type="number" min="1" max="90" value="4" required></div><div><label>Travelers</label><input id="people" type="number" min="1" max="30" value="2" required></div><div><label>Travel style</label><select id="style"><option value="0.75">Budget</option><option value="1" selected>Comfort</option><option value="1.65">Luxury</option></select></div><div><label>Travel mode</label><select id="mode"><option>Train</option><option>Bus</option><option>Car</option><option>Bike</option><option>Flight</option></select></div><div><label>Transport estimate (total ₹)</label><input id="transport" type="number" min="0" max="10000000" value="5000" required></div><div><label>Extra activities (total ₹)</label><input id="extra" type="number" min="0" max="10000000" value="2000" required></div><div><label>Target total budget (₹, optional)</label><input id="target" type="number" min="0" max="100000000" placeholder="e.g. 30000"></div><div style="align-self:end"><button class="primary" type="submit">Create my trip ✨</button></div></form><p class="note">Estimates are illustrative, not live hotel, transport or admission quotes. Transport must be entered by you.</p></div>`}
function makeTrip(){const d=DEST.find(x=>x.id===$('#destination').value),days=+$('#days').value,people=+$('#people').value,mult=+$('#style').value,transport=+$('#transport').value,extra=+$('#extra').value,target=+$('#target').value||null,origin=$('#origin').value.trim(),date=$('#date').value;if(!d||!origin||!date||days<1||days>90||people<1||people>30||[transport,extra].some(x=>!Number.isFinite(x)||x<0)){toast('Please check your trip details.');return}const stay=Math.round(d.daily*.48*mult*days*people),food=Math.round(d.daily*.32*mult*days*people),local=Math.round(d.daily*.2*mult*days*people),total=stay+food+local+transport+extra;data.trips.unshift({id:Date.now(),dest:d.id,origin,date,days,people,mode:$('#mode').value,stay,food,local,transport,extra,total,target,done:false});save();page='trips';render();toast('Your trip is ready! 🌸')}
function trips(){return `<div class="sectionhead"><div><h1>My trips 🧳</h1><p>Your saved plans, all in one cozy corner.</p></div><button class="primary" onclick="startTrip()">+ New trip</button></div>${data.trips.length?data.trips.map(t=>{const d=DEST.find(x=>x.id===t.dest);if(!d)return '';return `<article class="panel section"><div class="row between"><div><h2>${esc(t.origin)} → ${esc(d.name)}</h2><span class="small">${esc(t.date)} · ${t.days} days · ${t.people} traveler(s) · ${esc(t.mode)}</span></div><span class="money">${money(t.total)}</span></div><div class="grid" style="margin:15px 0">${[['Stay',t.stay],['Food',t.food],['Local travel',t.local],['To/from destination',t.transport],['Activities',t.extra]].map(([k,v])=>`<div class="result"><b>${k}</b><div>${money(v)}</div></div>`).join('')}</div>${t.target?`<p class="${t.total>t.target?'small':''}">Target ${money(t.target)} · ${t.total>t.target?'Over by '+money(t.total-t.target):'Under by '+money(t.target-t.total)}</p>`:''}<h3>Suggested stops</h3><p>${d.spots.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p><div class="row">${link('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(t.origin+', India')+'&destination='+encodeURIComponent(d.name+', India')+'&travelmode='+({Car:'driving',Bike:'driving',Bus:'transit',Train:'transit'}[t.mode]||'driving'),'🗺️ Directions')}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('hotels in '+d.name),'Find stays')}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('restaurants in '+d.name),'Find food')}<button class="ghost" onclick="exportTrip(${t.id})">↓ Export plan</button><button class="ghost" onclick="removeTrip(${t.id})">Delete</button></div><p class="note">Directions and search open Google Maps. Check travel mode and availability there.</p></article>`}).join(''):'<div class="empty panel"><h2>Your next story starts here ♡</h2><p>No trips saved yet.</p><button class="primary" onclick="startTrip()">Plan a trip</button></div>'}`}
function removeTrip(id){if(confirm('Delete this trip?')){data.trips=data.trips.filter(t=>t.id!==id);save();render()}}function exportTrip(id){let t=data.trips.find(x=>x.id===id),d=DEST.find(x=>x.id===t.dest),str=`WANDERLY TRIP PLAN\n${t.origin} to ${d.name}\nDate: ${t.date}\nDays: ${t.days}\nTravelers: ${t.people}\nMode: ${t.mode}\n\nBudget (illustrative)\nStay: ${money(t.stay)}\nFood: ${money(t.food)}\nLocal transport: ${money(t.local)}\nJourney transport: ${money(t.transport)}\nActivities: ${money(t.extra)}\nTotal: ${money(t.total)}\n\nSuggested places: ${d.spots.join(', ')}\n\nVerify prices and opening hours before travel.`;download(new Blob([str],{type:'text/plain'}),'wanderly-trip.txt')}
function gallery(){return `<h1>My memory book 📸</h1><p>A little home for your favorite adventures. Photos are stored locally in this browser; smaller images work best.</p><div class="panel"><label for="photos">Add your travel memories (up to 15 at once)</label><input id="photos" type="file" accept="image/*" multiple onchange="addPhotos(this.files)"><div class="row" style="margin-top:14px"><input id="placeCaption" placeholder="Place name for your next photos" maxlength="60" style="max-width:300px"><button class="primary" onclick="collage()">Create collage ✨</button></div></div><div class="section photo-grid">${data.photos.map((p,i)=>`<div class="card"><img src="${p.src}" alt="${esc(p.place||'Travel memory')}" loading="lazy"><div class="cardbody"><b>${esc(p.place||'A lovely memory')}</b><button class="ghost" style="float:right" onclick="removePhoto(${i})">×</button></div></div>`).join('')}</div>${!data.photos.length?'<p class="empty">Your gallery is waiting for its first memory 🌷</p>':''}<canvas id="collageCanvas" class="hidden"></canvas>`}
async function addPhotos(files){const place=$('#placeCaption').value.trim();for(const f of Array.from(files).slice(0,15)){if(!f.type.startsWith('image/'))continue;try{const img=await createImageBitmap(f),scale=Math.min(1,850/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);data.photos.push({src:canvas.toDataURL('image/jpeg',.67),place});img.close();save()}catch{toast('One photo could not be added.')}}render();toast('Memories added ♡')}
function removePhoto(i){data.photos.splice(i,1);save();render()}async function collage(){if(!data.photos.length){toast('Add photos first');return}let photos=data.photos.slice(0,15),c=document.createElement('canvas'),ctx=c.getContext('2d'),cols=3,size=450,gap=14,rows=Math.ceil(photos.length/cols);c.width=cols*size+(cols+1)*gap;c.height=rows*size+(rows+1)*gap+150;ctx.fillStyle='#fff0f3';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#b75177';ctx.font='bold 55px Georgia';ctx.fillText('Wanderly ♡',30,85);const loaded=await Promise.all(photos.map(p=>new Promise(resolve=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=p.src})));loaded.forEach((im,i)=>{if(!im)return;let x=gap+(i%cols)*(size+gap),y=135+gap+Math.floor(i/cols)*(size+gap),ratio=Math.max(size/im.width,size/im.height),w=im.width*ratio,h=im.height*ratio;ctx.save();ctx.beginPath();ctx.rect(x,y,size,size);ctx.clip();ctx.drawImage(im,x+(size-w)/2,y+(size-h)/2,w,h);ctx.restore()});c.toBlob(b=>{if(b)download(b,'wanderly-collage.png')},'image/png')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function tools(){return `<h1>Little travel tools 🌷</h1><div class="grid"><div class="panel"><h2>🗣️ Translator</h2><p>Choose your languages, then open Google Translate for typed or voice translation (where supported).</p><label>From</label><select id="from">${langs()}</select><label>To</label><select id="to">${langs('hi')}</select><textarea id="phrase" placeholder="Type a phrase to translate…"></textarea><button class="primary" onclick="translate()">Translate ↗</button></div><div class="panel"><h2>🗺️ Find my way</h2><label>Starting place</label><input id="mapFrom" placeholder="City or address"><label>Destination</label><input id="mapTo" placeholder="Where to?"><button class="ghost" onclick="myLocation()">📍 Use my location</button><button class="primary" onclick="directions()">Get directions ↗</button><p class="note">Location requires browser permission and HTTPS or localhost.</p></div><div class="panel"><h2>♥ My wishlist</h2>${data.wishlist.length?data.wishlist.map(id=>{let d=DEST.find(x=>x.id===id);return d?`<p><button class="ghost" onclick="detail('${d.id}')">${esc(d.name)} →</button></p>`:''}).join(''):'<p>Save places from Explore to see them here.</p>'}</div></div>`}const LANG=[['en','English'],['hi','Hindi'],['ml','Malayalam'],['te','Telugu'],['ta','Tamil'],['kn','Kannada'],['mr','Marathi'],['pa','Punjabi'],['gu','Gujarati'],['kok','Konkani'],['bn','Bengali'],['or','Odia'],['as','Assamese'],['ur','Urdu']];function langs(def='en'){return LANG.map(([code,name])=>`<option value="${code}" ${code===def?'selected':''}>${name}</option>`).join('')}function translate(){let q=$('#phrase').value.trim();window.open('https://translate.google.com/?sl='+$('#from').value+'&tl='+$('#to').value+'&text='+encodeURIComponent(q)+'&op=translate','_blank','noopener')}function directions(){let from=$('#mapFrom').value.trim(),to=$('#mapTo').value.trim();if(!from||!to){toast('Enter both locations');return}window.open('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(to),'_blank','noopener')}function myLocation(){if(!navigator.geolocation){toast('Location is not available');return}navigator.geolocation.getCurrentPosition(p=>{$('#mapFrom').value=p.coords.latitude+','+p.coords.longitude;toast('Location added')},()=>toast('Could not access location; enter it manually'),{timeout:12000})}
function profile(){return `<div class="panel" style="max-width:600px;margin:auto"><h1>Your cozy corner ♡</h1><p>Choose a nickname and an adorable profile picture.</p><label>Your name</label><input id="name" value="${esc(data.name)}" maxlength="40" placeholder="Your name"><label style="margin-top:15px">Your little avatar</label><div class="quizoptions">${['🌷','🐻','🦋','🍓','🌻','🐱','🎀','🌙'].map(a=>`<button class="${data.avatar===a?'chosen':''}" onclick="data.avatar='${a}';save();render()" style="font-size:30px">${a}</button>`).join('')}</div><button class="primary" style="margin-top:20px" onclick="data.name=$('#name').value.trim();save();render();toast('Profile saved ♡')">Save profile</button><p class="note">Your information is stored on this device only; clearing browser data can erase it.</p></div>`}
function render(){nav();$('#app').innerHTML=({home,explore,detail:detailPage,quiz:quizPage,planner,trips,gallery,tools,profile}[page]||home)()}render();
</script></body></html>
