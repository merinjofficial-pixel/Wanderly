function keralaGuide(){const cats=['All','Hill Stations','Backwaters','Beach','Wildlife','Nature','Culture','Spiritual'];const q=(window.keralaQuery||'').toLowerCase();const cat=window.keralaCat||'All';const all=DEST.filter(d=>d.state==='Kerala');const filtered=all.filter(d=>(cat==='All'||d.category===cat||(cat==='Hill Stations'&&d.name==='Munnar'))&&(`${d.name} ${d.desc} ${d.spots.join(' ')}`).toLowerCase().includes(q));return `<section class="kerala-hero"><span class="eyebrow">GOD'S OWN COUNTRY ✿</span><h1>Discover Kerala</h1><p>22 destinations, from misty mountains and winding backwaters to vibrant coastal towns. Search places and attractions below.</p></section><section class="section"><input class="search" aria-label="Search Kerala places and attractions" placeholder="Search Kerala: Varkala, Athirapally, temples…" value="${esc(window.keralaQuery||'')}" oninput="window.keralaQuery=this.value;keralaRefresh()"><div class="tabs">${cats.map(c=>`<button class="${cat===c?'on':''}" onclick="window.keralaCat='${c}';keralaRefresh()">${c}</button>`).join('')}</div><p class="note">${filtered.length} destination${filtered.length===1?'':'s'} · Tap Explore for detailed attractions and maps.</p><div id="keralaResults" class="grid">${filtered.map(destCard).join('')||'<p>No matching places. Try another search.</p>'}</div></section><p class="note">Images are illustrative, not necessarily photographs of the named location. Budgets are rough planning examples, not live prices. Verify access, permits, opening times and local conditions before travelling.</p>`}
function keralaRefresh(){const app=document.getElementById('app');if(!app)return;const active=document.activeElement,typing=active&&active.classList.contains('search')&&active.closest('#app');if(!typing){app.innerHTML=keralaGuide();return}const q=(window.keralaQuery||'').toLowerCase(),cat=window.keralaCat||'All';const filtered=DEST.filter(d=>d.state==='Kerala'&&(cat==='All'||d.category===cat||(cat==='Hill Stations'&&d.name==='Munnar'))&&(`${d.name} ${d.desc} ${d.spots.join(' ')}`).toLowerCase().includes(q));const result=document.getElementById('keralaResults');if(result)result.innerHTML=filtered.map(destCard).join('')||'<p>No matching places. Try another search.</p>';const note=result?.previousElementSibling;if(note&&note.classList.contains('note'))note.textContent=filtered.length+' matching destinations · Tap Explore for maps and attractions'}
function showPage(p){if(page==='camera'&&p!=='camera'&&typeof wcStop==='function')wcStop(false);page=p;selected=null;try{render();window.scrollTo(0,0)}catch(e){console.error('Navigation failed',p,e);page='home';render();toast('Returned to Home after an error.')}}function nav(){const items=[['home','⌂ Home'],['explore','⌕ Explore'],['quiz','✧ Trip quiz'],['trips','▤ My trips'],['gallery','▧ Gallery'],['camera','📷 Camera'],['translator','🎙 Translate'],['tools','♧ Tools'],['games','✦ Play'],['keralaGuide','🌴 Kerala guide'],['reminders','🔔 Reminders'],['journal','📖 Journal'],['assistant','✨ Trip assistant'],['privacy','🔒 Privacy'],['music','♫ Music & weather'],['checklist','✓ Checklist'],['partners','♡ Travel partners']];$('#nav').innerHTML=items.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="showPage('${p}')">${t}</button>`).join('');$('#bottom').innerHTML=[['home','⌂ Home'],['explore','⌕ Explore'],['keralaGuide','🌴 Kerala'],['translator','🎙 Speak'],['profile','♡ Profile']].map(([p,t])=>`<button class="${page===p?'active':''}" aria-current="${page===p?'page':'false'}" onclick="showPage('${p}')">${t}</button>`).join('');$('#profileChip').textContent=(data.avatar||'🌷')+' '+(data.name||'My corner')}
function destCard(d){return `<article class="card"><img src="${d.image}" alt="${esc(d.name)}" loading="lazy"><div class="cardbody"><div class="row between"><h3>${esc(d.name)}</h3><button class="ghost" aria-label="Save ${esc(d.name)}" onclick="wish('${d.id}')">${data.wishlist.includes(d.id)?'♥':'♡'}</button></div><div class="small">📍 ${esc(d.state)}</div><p>${esc(d.desc)}</p>${d.type.map(t=>`<span class="tag">${t}</span>`).join('')}<div class="row between" style="margin-top:12px"><span class="small">Illustrative daily budget ${money(d.daily)}</span><button class="primary" onclick="detail('${d.id}')">Explore →</button></div></div></article>`}function wish(id){data.wishlist=data.wishlist.includes(id)?data.wishlist.filter(x=>x!==id):[...data.wishlist,id];save();render();toast(data.wishlist.includes(id)?'Added to wishlist ♥':'Removed from wishlist')}
function home(){const greeting=data.name?'Welcome back, '+esc(data.name)+' ♡':'Your next beautiful escape starts here ♡';return `<section class="welcome-strip"><span>✦ YOUR PERSONAL TRAVEL COMPANION</span><span>INDIA EDITION · ✿</span></section><section class="hero"><div class="hero-content"><span class="hero-eyebrow">✧ EXPLORE MORE. FEEL MORE. ✧</span><h1>Go somewhere<br><em>wonderful.</em></h1><p>Discover extraordinary places, plan every detail and keep your favourite memories close.</p><div class="hero-actions"><button class="primary" onclick="showPage('explore')">Explore destinations ↗</button><button class="hero-secondary" onclick="showPage('quiz')">Find my travel style ✨</button></div></div><aside class="hero-founder" aria-label="A note from the founder"><span class="hero-founder-label">A LITTLE NOTE FROM THE FOUNDER</span><span class="hero-founder-message">Made with love for every journey, big or small. ♡</span><span class="hero-founder-signature">— MJ <small>Founder &amp; Developer</small></span></aside></section><section class="section home-greeting"><div><span class="eyebrow">GOOD TO SEE YOU</span><h2>${greeting}</h2><p>What would you love to do today?</p></div></section><section class="quick-grid"><button class="quick-action" onclick="showPage('planner')"><span class="quick-icon">🧳</span><b>Plan a trip</b><small>Build your itinerary</small></button><button class="quick-action" onclick="showPage('translator')"><span class="quick-icon">🎙️</span><b>Voice translator</b><small>Speak across languages</small></button><button class="quick-action" onclick="showPage('gallery')"><span class="quick-icon">📸</span><b>Memory book</b><small>Save travel moments</small></button><button class="quick-action" onclick="showPage('music')"><span class="quick-icon">🎧</span><b>Music & weather</b><small>Your journey soundtrack</small></button><button class="quick-action" onclick="showPage('games')"><span class="quick-icon">🎮</span><b>Play & wander</b><small>Five little adventures</small></button></section><section class="kerala-promo"><span>🌴 THE KERALA COLLECTION</span><h2>22 beautiful places. One unforgettable journey.</h2><p>Explore beaches, hills, backwaters, heritage, waterfalls and more.</p><button class="primary" onclick="showPage(&apos;keralaGuide&apos;)">Explore Kerala ↗</button></section><section class="feature-launch section"><span class="eyebrow">YOUR TRAVEL COMPANION</span><h2>Plan, remember & wander ✨</h2><div class="feature-tiles"><button onclick="showPage('reminders')">🔔<strong>Trip reminders</strong><small>Keep plans on track</small></button><button onclick="showPage('journal')">📖<strong>Travel journal</strong><small>Capture the moments</small></button><button onclick="showPage('assistant')">✨<strong>Trip assistant</strong><small>Build a day-by-day plan</small></button><button onclick="showPage('privacy')">🔒<strong>Privacy & backup</strong><small>Your data, your choice</small></button></div></section>${data.trips.length?`<section class="section"><div class="sectionhead"><div><span class="eyebrow">PICK UP WHERE YOU LEFT OFF</span><h2>Your next adventure</h2></div><button class="ghost" onclick="showPage('trips')">My trips ↗</button></div><div class="panel"><p>You have ${data.trips.length} saved trip${data.trips.length===1?'':'s'} waiting for you.</p><button class="primary" onclick="showPage('trips')">Continue planning →</button></div></section>`:''}<section class="section"><div class="sectionhead"><div><span class="eyebrow">HANDPICKED FOR YOU</span><h2>Places worth the journey <span class="rose">✿</span></h2><p>Find your next unforgettable escape.</p></div><button class="ghost" onclick="showPage('explore')">View all ↗</button></div><div class="grid featured-grid">${DEST.slice(0,4).map(destCard).join('')}</div></section><section class="section editorial-banner"><span class="eyebrow">THE WANDERLY WAY</span><h2>Little journeys. Big feelings.</h2><p>Discover, plan, translate and remember — all in one lovely place.</p><button class="primary" onclick="showPage('quiz')">Take the travel quiz ✨</button></section><footer class="mj-credit">Thoughtfully created by <strong>MJ</strong> <span>· Founder & Developer</span> ✿</footer>`}
function explore(){let ds=DEST.filter(d=>(filter==='All'||d.type.includes(filter))&&(`${d.name} ${d.state} ${d.desc} ${d.spots.join(' ')}`).toLowerCase().includes(search.toLowerCase()));return `<h1>Explore India 🌸</h1><p>Find your next beautiful place.</p><input class="search" id="search" placeholder="Explore India — search places, states, landmarks…" value="${esc(search)}" oninput="search=this.value;updateResults()"><div class="tabs">${['All','Nature','Beach','Culture','Adventure','Romantic','City','Spiritual'].map(x=>`<button class="${filter===x?'on':''}" onclick="filter='${x}';updateResults()">${x}</button>`).join('')}</div><div id="results" class="grid">${ds.map(destCard).join('')||'<p>No places found. Try another search.</p>'}</div><p class="note">Browse our growing India collection, including 22 Kerala destinations. Images are illustrative.</p>`}function updateResults(){let input=$('#search');if(input)search=input.value;$('#results').innerHTML=DEST.filter(d=>(filter==='All'||d.type.includes(filter))&&(`${d.name} ${d.state} ${d.desc} ${d.spots.join(' ')}`).toLowerCase().includes(search.toLowerCase())).map(destCard).join('')||'<p>No places found.</p>';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.textContent===filter))}
function detail(id){selected=DEST.find(d=>d.id===id);page='detail';render();window.scrollTo(0,0)}function detailPage(){let d=selected;if(!d)return explore();return `<button class="ghost" onclick="showPage('explore')">← Explore</button><div class="section hero" style="background-image:linear-gradient(90deg,#542c44aa,#542c4420),url('${d.image}')"><div><h1>${esc(d.name)}</h1><p>${esc(d.state)} · ${d.type.join(' · ')}</p></div></div><section class="section panel"><h2>Meet ${esc(d.name)} ✿</h2><p>${esc(d.desc)}</p><h3>Places to see</h3><div class="grid">${d.spots.map(s=>`<div class="panel"><h3>${esc(s)}</h3>${link(map(s+', '+d.name+', India'),'📍 View on map')}</div>`).join('')}</div><h3 style="margin-top:24px">Local flavors</h3><p>${d.food.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p><p class="note">Place descriptions and indicative budgets are starter content. Confirm hours, fees and local conditions before traveling.</p><div class="row"><button class="primary" onclick="startTrip('${d.id}')">Plan a trip here 🧳</button><button class="ghost" onclick="wish('${d.id}')">${data.wishlist.includes(d.id)?'♥ Saved':'♡ Save'}</button>${link('https://en.wikipedia.org/wiki/'+encodeURIComponent(d.name),'Read more ↗')}</div></section>`}
const QUESTIONS=[['What kind of escape are you dreaming of?',['Nature','Beach','Culture','Adventure','Romantic','Spiritual']],['Who is coming along?',['Solo','Couple','Family','Friends']],['How long will you wander?',['1–3 days','4–7 days','8–14 days','15–30 days','1–3 months']],['Your budget per person?',['Under ₹5,000','₹5,000–₹15,000','₹15,000–₹35,000','₹35,000+']],['Food preference?',['Vegetarian','Non-vegetarian','Both']],['Favorite way to travel?',['Train','Bus','Car','Bike','Flight','Flexible']]];function quizPage(){if(quizStep>=QUESTIONS.length){let matches=DEST.filter(d=>d.type.includes(quiz[0])).sort((a,b)=>a.daily-b.daily);if(!matches.length)matches=DEST.slice(0,3);return `<div class="panel"><h1>Your dreamy matches ✨</h1><p>Based on your ${esc(quiz[0])} preference. These are suggestions, not guaranteed matches.</p><div class="grid">${matches.map(destCard).join('')}</div><div class="row" style="margin-top:20px"><button class="ghost" onclick="quizStep=0;quiz={};render()">Start again</button><button class="primary" onclick="startTrip('${matches[0].id}')">Plan this trip</button></div></div>`}let [q,options]=QUESTIONS[quizStep];return `<div class="panel" style="max-width:730px;margin:30px auto"><span class="tag">Question ${quizStep+1} of ${QUESTIONS.length}</span><div class="steps">${QUESTIONS.map((_,i)=>`<span class="step" style="opacity:${i<=quizStep?1:.35}">${i+1}</span>`).join('')}</div><h1>${q}</h1><div class="quizoptions">${options.map(o=>`<button class="${quiz[quizStep]===o?'chosen':''}" onclick="quiz[${quizStep}]=${JSON.stringify(o).replace(/"/g,'&quot;')};render()">${o}</button>`).join('')}</div><div class="row between" style="margin-top:26px"><button class="ghost" onclick="quizStep=Math.max(0,quizStep-1);render()">← Back</button><button class="primary" ${!quiz[quizStep]?'disabled':''} onclick="if(quizStep===QUESTIONS.length-1){data.travelMusicStyle=quiz[0];save()}quizStep++;render()">${quizStep===QUESTIONS.length-1?'Find my places':'Next →'}</button></div></div>`}
function startTrip(id){page='planner';selected=DEST.find(d=>d.id===id)||null;render();window.scrollTo(0,0)}function planner(){return `<div class="panel"><h1>Plan a little adventure 🧳</h1><p>Customize your trip and receive an editable, indicative budget.</p><form onsubmit="event.preventDefault();makeTrip()" class="formgrid"><div><label>Destination</label><select id="destination" required>${DEST.map(d=>`<option value="${d.id}" ${selected?.id===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div><div><label>Starting city</label><input id="origin" required placeholder="e.g. Kochi" maxlength="100"></div><div><label>Start date</label><input id="date" type="date" required min="${new Date().toISOString().slice(0,10)}"></div><div><label>Days (1–90)</label><input id="days" type="number" min="1" max="90" value="4" required></div><div><label>Travelers</label><input id="people" type="number" min="1" max="30" value="2" required></div><div><label>Travel style</label><select id="style"><option value="0.75">Budget</option><option value="1" selected>Comfort</option><option value="1.65">Luxury</option></select></div><div><label>Travel mode</label><select id="mode"><option>Train</option><option>Bus</option><option>Car</option><option>Bike</option><option>Flight</option></select></div><div><label>Transport estimate (total ₹)</label><input id="transport" type="number" min="0" max="10000000" value="5000" required></div><div><label>Extra activities (total ₹)</label><input id="extra" type="number" min="0" max="10000000" value="2000" required></div><div><label>Target total budget (₹, optional)</label><input id="target" type="number" min="0" max="100000000" placeholder="e.g. 30000"></div><div style="align-self:end"><button class="primary" type="submit">Create my trip ✨</button></div></form><p class="note">Estimates are illustrative, not live hotel, transport or admission quotes. Transport must be entered by you.</p></div>`}
function makeTrip(){const d=DEST.find(x=>x.id===$('#destination').value),days=+$('#days').value,people=+$('#people').value,mult=+$('#style').value,transport=+$('#transport').value,extra=+$('#extra').value,target=+$('#target').value||null,origin=$('#origin').value.trim(),date=$('#date').value;if(!d||!origin||!date||days<1||days>90||people<1||people>30||[transport,extra].some(x=>!Number.isFinite(x)||x<0)){toast('Please check your trip details.');return}const stay=Math.round(d.daily*.48*mult*days*people),food=Math.round(d.daily*.32*mult*days*people),local=Math.round(d.daily*.2*mult*days*people),total=stay+food+local+transport+extra;data.trips.unshift({id:Date.now(),dest:d.id,origin,date,days,people,mode:$('#mode').value,stay,food,local,transport,extra,total,target,done:false});save();page='trips';render();toast('Your trip is ready! 🌸')}

">3. Preview & save</h3><div class="studio-preview"><canvas id="collagePreview" aria-label="Your collage preview"></canvas></div><p id="collageStatus" class="small" role="status">Choose your photos to begin.</p><div class="row"><button class="primary" onclick="collage()">↓ Save high-quality PNG</button><button class="ghost" onclick="previewCollage()">↻ Refresh preview</button></div></section>`:'<div class="panel empty"><h2>Your creative studio is ready ♡</h2><p>Add a few photos to start your first collage.</p></div>'}`}

function photoToImage(f){return new Promise((resolve,reject)=>{let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Unsupported image'))};im.src=u})}

oto(ctx,im,pad+offset+col*(cw+gap),top+row*(ch+gap),cw,ch,collageState.fit,10)})}ctx.textAlign='center';ctx.fillStyle=dark?'#fff':'#775969';ctx.font=`${Math.round(w*.025)}px Georgia`;ctx.fillText((collageState.caption.trim()||'Made with ♡ on Wanderly').slice(0,75),w/2,h-pad*.95,w-pad*2);return true}
async function previewCollage(){let canvas=$('#collagePreview'),status=$('#collageStatus');if(!canvas)return;if(!collageState.selected.length){status.textContent='Select at least one photo to preview.';return}status.textContent='Creating preview…';try{await renderCollage(canvas);status.textContent='Your collage is ready to save.'}catch(e){status.textContent='Preview failed. Try fewer or smaller photos.'}}

function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function tools(){return `<h1>Little travel tools 🌷</h1><div class="grid"><div class="panel"><h2>🗣️ Translator</h2><p>Choose your languages, then open Google Translate for typed or voice translation (where supported).</p><label>From</label><select id="from">${langs()}</select><label>To</label><select id="to">${langs('hi')}</select><textarea id="phrase" placeholder="Type a phrase to translate…"></textarea><button class="primary" onclick="translate()">Translate ↗</button></div><div class="panel"><h2>🗺️ Find my way</h2><label>Starting place</label><input id="mapFrom" placeholder="City or address"><label>Destination</label><input id="mapTo" placeholder="Where to?"><button class="ghost" onclick="myLocation()">📍 Use my location</button><button class="primary" onclick="directions()">Get directions ↗</button><p class="note">Location requires browser permission and HTTPS or localhost.</p></div><div class="panel"><h2>♥ My wishlist</h2>${data.wishlist.length?data.wishlist.map(id=>{let d=DEST.find(x=>x.id===id);return d?`<p><button class="ghost" onclick="detail('${d.id}')">${esc(d.name)} →</button></p>`:''}).join(''):'<p>Save places from Explore to see them here.</p>'}</div></div>`}const LANG=[['en','English'],['hi','Hindi'],['ml','Malayalam'],['te','Telugu'],['ta','Tamil'],['kn','Kannada'],['mr','Marathi'],['pa','Punjabi'],['gu','Gujarati'],['kok','Konkani'],['bn','Bengali'],['or','Odia'],['as','Assamese'],['ur','Urdu']];function langs(def='en'){return LANG.map(([code,name])=>`<option value="${code}" ${code===def?'selected':''}>${name}</option>`).join('')}function translate(){let q=$('#phrase').value.trim();window.open('https://translate.google.com/?sl='+$('#from').value+'&tl='+$('#to').value+'&text='+encodeURIComponent(q)+'&op=translate','_blank','noopener')}function directions(){let from=$('#mapFrom').value.trim(),to=$('#mapTo').value.trim();if(!from||!to){toast('Enter both locations');return}window.open('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(to),'_blank','noopener')}function myLocation(){if(!navigator.geolocation){toast('Location is not available');return}navigator.geolocation.getCurrentPosition(p=>{$('#mapFrom').value=p.coords.latitude+','+p.coords.longitude;toast('Location added')},()=>toast('Could not access location; enter it manually'),{timeout:12000})}

const VOICE_LANG=[['en','English','en-IN'],['hi','Hindi','hi-IN'],['ml','Malayalam','ml-IN'],['ta','Tamil','ta-IN'],['te','Telugu','te-IN'],['kn','Kannada','kn-IN'],['bn','Bengali','bn-IN'],['mr','Marathi','mr-IN'],['gu','Gujarati','gu-IN'],['pa','Punjabi','pa-IN'],['ur','Urdu','ur-IN'],['fr','French','fr-FR'],['es','Spanish','es-ES']];

<div class="panel"><div class="formgrid"><div><label for="voiceFrom">I speak</label><select id="voiceFrom" onchange="voiceLanguageChanged()">${voiceOptions('en')}</select></div><div><label for="voiceTo">Translate into</label><select id="voiceTo" onchange="voiceLanguageChanged()">${voiceOptions('ml')}</select></div></div>
<div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" onclick="voiceSwap()">⇄ Swap languages</button></div>
<div class="voice-panel"><label for="voiceInput">Your words (edit if needed)</label><textarea id="voiceInput" placeholder="Tap the microphone and speak, or type here…" aria-label="Speech transcription"></textarea>
<button id="voiceMic" class="voice-mic" onclick="voiceToggle()" aria-label="Start or stop voice recording" aria-pressed="false">🎙</button><div id="voiceStatus" class="voice-status" role="status">Tap the microphone to speak</div><div class="row" style="justify-content:center"><button class="primary" id="voiceTranslate" onclick="voiceTranslate()">Translate ✨</button><button class="ghost" onclick="voiceClear()">Clear</button></div></div>

<p class="note">Speech recognition needs microphone permission, an internet connection and a supported browser/language. Translation uses the third-party MyMemory service, which may limit requests or not support every language pair. Your text is sent to that service when you translate. Do not use for confidential conversations or emergencies. Check important translations with a local speaker.</p>
<button class="ghost" onclick="voiceGoogle()">Open Google Translate if unavailable ↗</button></div></div>`}
function voiceStatus(message){const el=$('#voiceStatus');if(el)el.textContent=message}
function voiceLanguageChanged(){if(voiceRecognition){voiceRecognition.abort();voiceRecognition=null;voiceBusy=false;voiceMicState(false)}if(window.speechSynthesis)window.speechSynthesis.cancel();voiceStatus('Language changed. Tap the microphone to speak.')}

function voiceToggle(){
 if(voiceBusy){voiceRecognition?.stop();voiceStatus('Finishing transcription…');return}
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){voiceStatus('Voice recognition is not supported in this browser. Try Chrome or type your words.');return}
 const from=$('#voiceFrom').value;
 const rec=new SpeechRecognition();voiceRecognition=rec;
 rec.lang=VOICE_LANG.find(l=>l[0]===from)?.[2]||from;rec.continuous=false;rec.interimResults=true;

 rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const part=e.results[i][0].transcript;if(e.results[i].isFinal){finalText+=(finalText?' ':'')+part;gotFinal=true}else interim+=part}$('#voiceInput').value=finalText+(interim?' '+interim:'')};

 rec.onend=()=>{voiceBusy=false;voiceMicState(false);if(gotFinal){$('#voiceInput').value=finalText;voiceStatus('Speech transcribed. Translating…');voiceTranslate()}else if(!$('#voiceStatus').textContent.startsWith('Microphone error'))voiceStatus('No speech captured. Try again or type your words.')};
 try{rec.start()}catch(e){voiceBusy=false;voiceMicState(false);voiceStatus('Could not start microphone. Check Chrome permissions.')}
}
async function voiceTranslate(){
 const source=$('#voiceInput').value.trim(),from=$('#voiceFrom').value,to=$('#voiceTo').value,out=$('#voiceOutput'),button=$('#voiceTranslate');
 if(!source){voiceStatus('Please speak or type something first.');return}
 if(source.length>450){voiceStatus('Please use 450 characters or fewer per translation.');return}
 if(from===to){out.textContent=source;voiceStatus('Both languages are the same.');return}
 button.disabled=true;out.textContent='Translating…';
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);

  const doc=new DOMParser().parseFromString(translated,'text/html');
  out.textContent=doc.body.textContent||translated;
  voiceStatus('Translation ready! Tap 🔊 to hear it.');
 }catch(e){out.textContent='Translation unavailable right now.';voiceStatus(e.name==='AbortError'?'Translation timed out. Try again.':String(e.message||e)+'. Try Google Translate below.')}

set an alarm or calendar reminder. Wanderly cannot currently send background push notifications.</p>`}

function checkReminders(){if(!data?.reminders)return;const now=Date.now();let changed=false;data.reminders.forEach(r=>{const due=new Date(r.when).getTime();if(!r.notified&&due<=now&&now-due<60*60*1000){r.notified=true;changed=true;if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Wanderly · '+r.type,{body:r.title,icon:'./icons/icon-192.png'})}catch{toast('Reminder: '+r.title)}}else toast('Reminder: '+r.title)}});if(changed)save()}

function journal(){const entries=[...data.journal].sort((a,b)=>b.id-a.id);return `<section class="feature-head"><span class="eyebrow">THE LITTLE MOMENTS MATTER</span><h1>Your travel journal 📖</h1><p>Collect beautiful moments, favourite places and stories worth remembering.</p></section><section class="panel"><h2>Write a memory ♡</h2><form onsubmit="event.preventDefault();addJournal()" class="formgrid"><div><label>Place or trip</label><input id="journalPlace" maxlength="90" required placeholder="e.g. Varkala sunset"></div><div><label>Date</label><input id="journalDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div style="grid-column:1/-1"><label>Your story</label><textarea id="journalText" maxlength="3000" rows="5" required placeholder="What made today special?"></textarea></div><div><label>Highlight</label><select id="journalMood"><option>🌸 A lovely day</option><option>🌅 Beautiful sunset</option><option>🍲 Delicious discovery</option><option>🌿 Nature escape</option><option>✨ Unforgettable moment</option></select></div><div><label>Photo (optional)</label><input id="journalPhoto" type="file" accept="image/*"></div><div><button class="primary" type="submit">Save my memory ✨</button></div></form></section><section class="section"><h2>Pages from your journey</h2><div class="journal-grid">${entries.length?entries.map(e=>`<article class="journal-card">${e.photo?`<img src="${e.photo}" alt="${esc(e.place)}" loading="lazy">`:''}<div class="journal-copy"><span class="eyebrow">${esc(e.date)} · ${esc(e.mood)}</span><h3>${esc(e.place)}</h3><p>${esc(e.text).replace(/\n/g,'<br>')}</p><button class="ghost" onclick="removeJournal(${e.id})">Delete entry</button></div></article>`).join(''):'<div class="panel empty">Your first journal page is waiting for you. 🌷</div>'}</div></section><p class="note">Entries and photos stay on this device. Export a backup in Privacy before clearing browser data.</p>`}
async function addJournal(){const place=$('#journalPlace').value.trim(),date=$('#journalDate').value,text=$('#journalText').value.trim(),mood=$('#journalMood').value,file=$('#journalPhoto').files[0];if(!place||!date||!text){toast('Please complete your memory');return}let photo='';if(file){if(!file.type.startsWith('image/')){toast('Please choose an image');return}try{const img=await createImageBitmap(file),c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.6);img.close()}catch{toast('Photo could not be read');return}}data.journal.push({id:Date.now(),place,date,text,mood,photo});save();render();toast('Memory saved ♡')}

function assistant(){return `<section class="feature-head"><span class="eyebrow">YOUR PERSONAL TRAVEL PLANNER</span><h1>Trip assistant ✨</h1><p>Build a thoughtful, editable starting itinerary for your next escape.</p></section><section class="panel"><form onsubmit="event.preventDefault();suggestItinerary()" class="formgrid"><div><label>Destination</label><select id="aiDest">${DEST.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div><label>Duration (days)</label><input id="aiDays" type="number" min="1" max="14" value="3" required></div><div><label>Budget per person (₹)</label><input id="aiBudget" type="number" min="500" max="1000000" value="10000" required></div><div><label>What do you love?</label><select id="aiInterest"><option value="Nature">Nature & scenery</option><option value="Culture">Culture & heritage</option><option value="Beach">Beaches & relaxation</option><option value="Adventure">Adventure & exploring</option><option value="Food">Food & local experiences</option><option value="Spiritual">Spiritual places</option></select></div><div><label>Travel pace</label><select id="aiPace"><option value="2">Relaxed</option><option value="3" selected>Balanced</option><option value="4">See more</option></select></div><div><button class="primary" type="submit">Create my itinerary ✨</button></div></form><p class="note">This version uses your Wanderly destination guide and planning rules; it is not connected to a live generative-AI service. All timings and costs are suggestions.</p></section><section id="assistantResult" class="section"></section>`}
function suggestItinerary(){const d=DEST.find(x=>x.id===$('#aiDest').value),days=Number($('#aiDays').value),budget=Number($('#aiBudget').value),interest=$('#aiInterest').value,pace=Number($('#aiPace').value);if(!d||days<1||days>14||budget<500){toast('Check your trip details');return}const spots=[...d.spots];if(interest==='Nature')spots.sort((a,b)=>/lake|hill|peak|waterfall|forest|park|view/i.test(b)-/lake|hill|peak|waterfall|forest|park|view/i.test(a));if(interest==='Culture'||interest==='Spiritual')spots.sort((a,b)=>/temple|fort|palace|church|museum|mosque|heritage/i.test(b)-/temple|fort|palace|church|museum|mosque|heritage/i.test(a));if(interest==='Beach')spots.sort((a,b)=>/beach|coast|island|backwater/i.test(b)-/beach|coast|island|backwater/i.test(a));const daily=Math.round(budget/days);const rows=Array.from({length:days},(_,i)=>{const stops=Array.from({length:Math.min(pace,spots.length)},(_,j)=>spots[(i*pace+j)%spots.length]);return `<article class="panel day-card"><span class="eyebrow">DAY ${i+1}</span><h3>${i===0?'Arrive & explore':i===days-1?'One last lovely day':'Discover more'}</h3><p>Suggested stops: ${stops.map(esc).join(' · ')}</p><p class="small">Allow time for meals, rest and local travel. Indicative budget: ${money(daily)} per person.</p></article>`}).join('');$('#assistantResult').innerHTML=`<div class="sectionhead"><div><span class="eyebrow">YOUR SUGGESTED ESCAPE</span><h2>${esc(d.name)} · ${days} days</h2><p>${esc(interest)} · ${money(budget)} per person total</p></div><button class="ghost" onclick="startTrip('${d.id}')">Save as a trip →</button></div>${rows}<p class="note">Not a reservation or route-optimized schedule. Confirm distances, seasonal access, admission and costs.</p>`}

function gameSave(id,n){if(n>gameBest(id)){try{localStorage.setItem('wanderly-game-'+id,String(n))}catch{}}}
function games(){const cards=[['trivia','🗺️','Destination Quiz','Five questions, one curious traveller.'],['memory','🌸','Postcard Match','Find the matching travel postcards.'],['emoji','✨','Guess the Getaway','Decode a destination from emojis.'],['packing','🧳','Pack Your Bags','Find everything for your adventure.'],['word','🔤','Destination Scramble','Unscramble a beautiful place.']];return `<div class="arcade"><div class="arcade-hero"><span class="eyebrow">A LITTLE JOY BETWEEN JOURNEYS</span><h1>The Wanderly Arcade <span>✿</span></h1><p>Five charming mini-games for curious explorers. No account needed — just play!</p></div>${playGame?`<button class="ghost" onclick="playGame='';render()">← All games</button><div id="gameStage">${gameStage()}</div>`:`<div class="arcade-grid">${cards.map(([id,emoji,title,desc],i)=>`<button class="game-tile game-tile-${i}" onclick="gameStart('${id}')"><span class="game-art">${emoji}</span><span class="game-kicker">MINI GAME 0${i+1}</span><strong>${title}</strong><small>${desc}</small><span class="game-cta">Play now ↗</span></button>`).join('')}</div><p class="note" style="text-align:center">Made for little breaks and lovely discoveries ♡</p>`}</div>`}
function gameStart(id){playGame=id;playStep=0;playScore=0;playAnswered=false;playPacked=[];playMoves=0;playMatched=[];playOpen=[];playLock=false;playWord='';if(id==='memory'){playDeck=[...GAME_MEMORY,...GAME_MEMORY].map((v,i)=>({v,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(x=>x.v)}gameRefresh()}
function gameRefresh(){if(page==='games')$('#app').innerHTML=games()}
function gameStage(){if(playGame==='trivia'||playGame==='emoji'){const data=playGame==='trivia'?GAME_TRIVIA:GAME_EMOJI;if(playStep>=data.length){gameSave(playGame,playScore);return gameEnd(data.length)}const [q,opts,answer,info]=data[playStep];return `<section class="game-stage"><div class="game-progress">ROUND ${playStep+1} / ${data.length} <span>✦ ${playScore} points</span></div><div class="game-progressbar"><i style="width:${playStep/data.length*100}%"></i></div><div class="${playGame==='emoji'?'emoji-puzzle':'game-question'}">${q}</div><div class="game-answers">${opts.map((o,i)=>`<button ${playAnswered?'disabled':''} class="${playAnswered?(i===answer?'correct':''):''}" onclick="gameAnswer(${i})">${o}</button>`).join('')}</div>${playAnswered?`<p class="game-feedback">${playScore&&playAnswered==='correct'?'Lovely! ✨':'Good try! 🌷'} ${info}</p><button class="primary" onclick="playStep++;playAnswered=false;gameRefresh()">Continue →</button>`:''}</section>`}
if(playGame==='memory'){return `<section class="game-stage"><h2>🌸 Postcard Match</h2><p>Find all six matching pairs.</p><div class="game-progress">MATCHED ${playMatched.length/2} / 6 <span>${playMoves} moves</span></div><div class="memory-grid">${playDeck.map((v,i)=>`<button class="${playOpen.includes(i)||playMatched.includes(i)?'revealed':''}" aria-label="${playOpen.includes(i)||playMatched.includes(i)?v:'Hidden postcard'}" onclick="gameFlip(${i})" ${playMatched.includes(i)?'disabled':''}>${playOpen.includes(i)||playMatched.includes(i)?v:'✿'}</button>`).join('')}</div>${playMatched.length===12?`<h3>All postcards found! ✨</h3><p>Completed in ${playMoves} moves.</p><button class="primary" onclick="gameStart('memory')">Play again ↻</button>`:'<p class="note">Tap two postcards to reveal them.</p>'}</section>`}
if(playGame==='packing'){return `<section class="game-stage"><h2>🧳 Pack Your Bags</h2><p>Tap everything you need for your trip. Pack all eight essentials!</p><div class="game-progress">${playPacked.length} / ${GAME_PACK.length} PACKED</div><div class="packing-grid">${GAME_PACK.map((v,i)=>`<button class="${playPacked.includes(i)?'packed':''}" onclick="gamePack(${i})">${playPacked.includes(i)?'✓ ':'＋ '}${v}</button>`).join('')}</div>${playPacked.length===GAME_PACK.length?'<h3>Ready for takeoff! 🎉</h3><button class="primary" onclick="gameStart(\'packing\')">Pack again ↻</button>':'<p class="note">Tip: every item on this list belongs in your travel bag.</p>'}</section>`}
if(playGame==='word'){if(playStep>=GAME_WORDS.length){gameSave('word',playScore);return gameEnd(GAME_WORDS.length)}let answer=GAME_WORDS[playStep];if(!playWord){playWord=answer.split('').sort(()=>Math.random()-.5).join('');if(playWord===answer)playWord=answer.slice(1)+answer[0]}return `<section class="game-stage"><div class="game-progress">DESTINATION ${playStep+1} / ${GAME_WORDS.length}<span>✦ ${playScore} points</span></div><h2>Where are we going? ✨</h2><div class="scramble">${playWord.split('').map(c=>`<span>${c}</span>`).join('')}</div><label for="wordGuess">Your answer</label><input id="wordGuess" maxlength="15" autocomplete="off" placeholder="Type the destination…" onkeydown="if(event.key==='Enter')gameWordCheck()"><button class="primary" onclick="gameWordCheck()">Check answer ✿</button><p class="game-feedback" id="wordFeedback"></p><button class="ghost" onclick="playStep++;playWord='';gameRefresh()">Skip this word →</button></section>`}return ''}
function gameAnswer(i){if(playAnswered)return;const row=(playGame==='trivia'?GAME_TRIVIA:GAME_EMOJI)[playStep];if(i===row[2]){playScore++;playAnswered='correct'}else playAnswered='incorrect';gameRefresh()}
function gameFlip(i){if(playLock||playOpen.includes(i)||playMatched.includes(i)||playMatched.length===12)return;playOpen.push(i);if(playOpen.length===2){playMoves++;if(playDeck[playOpen[0]]===playDeck[playOpen[1]]){playMatched.push(...playOpen);playOpen=[];if(playMatched.length===12)gameSave('memory',Math.max(1,30-playMoves))}else{playLock=true;gameRefresh();setTimeout(()=>{playOpen=[];playLock=false;gameRefresh()},850);return}}gameRefresh()}
function gamePack(i){if(!playPacked.includes(i))playPacked.push(i);if(playPacked.length===GAME_PACK.length)gameSave('packing',8);gameRefresh()}
function gameWordCheck(){const input=$('#wordGuess');if(!input)return;if(input.value.trim().toUpperCase()===GAME_WORDS[playStep]){playScore++;playStep++;playWord='';gameRefresh()}else $('#wordFeedback').textContent='Not quite! Give it another try 🌷'}
function gameEnd(total){return `<section class="game-stage game-finish"><div class="game-art">🏆</div><h2>Beautifully played!</h2><p>You scored ${playScore} out of ${total}. ${playScore===total?'A perfect little adventure! ✨':'Every journey teaches us something. ♡'}</p><p class="note">Personal best: ${gameBest(playGame)} / ${total}</p><button class="primary" onclick="gameStart(playGame)">Play again ↻</button><button class="ghost" onclick="playGame='';gameRefresh()">All games</button></section>`}


/* Local packing checklist with haptic feedback; vibrate availability depends on device/browser. */
const DEFAULT_PACK=['Passport / ID','Phone charger','Travel tickets','Comfortable outfits','Toiletries','Medication','Reusable water bottle','Camera'];
function ensurePack(){if(!Array.isArray(data.packItems))data.packItems=DEFAULT_PACK.map((title,i)=>({id:i+1,title,done:false}));}
function checklist(){ensurePack();return `<section class="feature-head"><span class="eyebrow">LITTLE THINGS, BIG ADVENTURES</span><h1>Pack beautifully ♡</h1><p>Tap an item for a tiny bounce. Completed items slide into your packed collection.</p></section><section class="panel" style="max-width:680px;margin:auto"><form onsubmit="event.preventDefault();addPackItem()" class="row"><input id="packNew" maxlength="75" required placeholder="Add something to pack…" style="flex:1;min-width:170px"><button class="primary">+ Add</button></form><h2 style="margin-top:25px">To pack</h2><div id="packPending">${data.packItems.filter(x=>!x.done).map(x=>`<label class="pack-item" id="pack-${x.id}"><input type="checkbox" onchange="finishPack(${x.id},this)"><span>${esc(x.title)}</span></label>`).join('')||'<p>Everything is packed! ✨</p>'}</div><details style="margin-top:20px"><summary style="cursor:pointer">Packed · ${data.packItems.filter(x=>x.done).length}</summary>${data.packItems.filter(x=>x.done).map(x=>`<label class="pack-item"><input type="checkbox" checked onchange="undoPack(${x.id})"><span>${esc(x.title)}</span></label>`).join('')}</details><button class="ghost" style="margin-top:16px" onclick="resetPack()">Reset checklist</button></section>`}
function addPackItem(){ensurePack();let input=$('#packNew');if(!input||!input.value.trim())return;data.packItems.push({id:Date.now(),title:input.value.trim(),done:false});save();render()}
function finishPack(id,input){if(!input.checked)return;const item=input.closest('.pack-item');if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){};if(item)item.classList.add('pack-exit');setTimeout(()=>{let x=data.packItems.find(x=>x.id===id);if(x)x.done=true;save();if(page==='checklist')render()},340)}
function undoPack(id){let x=data.packItems.find(x=>x.id===id);if(x)x.done=false;save();render()}
function resetPack(){if(!confirm('Reset your packing checklist?'))return;ensurePack();data.packItems.forEach(x=>x.done=false);save();render()}
/* Demo-only profiles: no account or partner discovery backend is implied. */
const PARTNER_DEMOS=[{name:'The mountain wanderer',interest:'Hiking · Nature',about:'A sample travel moodboard for someone who loves sunrise hikes and misty valleys.',image:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=700&auto=format&fit=crop'},{name:'The coastal explorer',interest:'Beaches · Photography',about:'A sample travel moodboard for sunset photography and unplanned seaside adventures.',image:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700&auto=format&fit=crop'},{name:'The city storyteller',interest:'Culture · Food',about:'A sample travel moodboard for architecture, local cafés and cultural walks.',image:'https://images.unsplash.com/photo-1480796927426-f609979314bd?w=700&auto=format&fit=crop'}];
function partners(){return `<section class="feature-head"><span class="eyebrow">A LITTLE INSPIRATION</span><h1>Travel partner moodboards ♡</h1><p>Tap a portrait to see a fluid expanding profile preview. These are illustrative profiles, not real users or a matching service.</p></section><div class="grid">${PARTNER_DEMOS.map((p,i)=>`<article class="panel"><button class="partner-thumb" onclick="openPartner(${i},this)" aria-label="View ${esc(p.name)}"><img src="${p.image}" alt="${esc(p.interest)}"></button><h3 style="margin-top:12px">${esc(p.name)}</h3><p>${esc(p.interest)}</p><button class="ghost" onclick="openPartner(${i},this)">Explore profile →</button></article>`).join('')}</div>`}
function openPartner(i,source){const p=PARTNER_DEMOS[i];if(!p)return;const overlay=document.createElement('div');overlay.className='partner-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label',p.name);overlay.innerHTML=`<div class="partner-sheet"><img src="${p.image}" alt="${esc(p.interest)}" id="partnerHero"><div class="partner-body"><h2>${esc(p.name)}</h2><span class="tag">${esc(p.interest)}</span><p>${esc(p.about)}</p><p class="note">Illustrative profile only · No personal data is exchanged.</p><button class="primary" onclick="closePartner()">Close ✕</button></div></div>`;overlay.addEventListener('click',e=>{if(e.target===overlay)closePartner()});document.body.appendChild(overlay);const from=source.querySelector('img')||source;const to=overlay.querySelector('#partnerHero');if(from&&to&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const key='wanderly-partner';from.style.viewTransitionName=key;to.style.viewTransitionName=key;document.startViewTransition(()=>{}).finished.finally(()=>{from.style.viewTransitionName='';to.style.viewTransitionName=''})}overlay.querySelector('button').focus()}
function closePartner(){document.querySelector('.partner-overlay')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePartner()});

function render(){
 const root=$('#app');if(!root)return;
 try{
  nav();
  root.innerHTML=({home,explore,detail:detailPage,quiz:quizPage,planner,trips,gallery,camera,translator,tools,profile,games,keralaGuide,reminders,journal,assistant,privacy,music,checklist,partners}[page]||home)();
  if(page==='gallery')Promise.resolve().then(()=>previewCollage()).catch(e=>console.error('Collage preview:',e));
 }catch(e){
  console.error('Wanderly render error:',page,e);
  root.innerHTML='<section class="panel" style="margin:25px auto;max-width:620px;text-align:center"><h1>Welcome to Wanderly 🌷</h1><p>Something interrupted this screen. Your saved trips and photos are still on this device.</p><button class="primary" onclick="page=\'home\';render()">Try Home again</button> <button class="ghost" onclick="location.reload()">Refresh app</button></section>';
 }
 const splash=document.getElementById('wanderlyLaunch');
 if(splash){setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>splash.remove(),500)},1350)}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true});else render();
</script><script src="./camera.js"></script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.warn));</script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const splash=document.getElementById('wanderlyLaunch');
    if(splash) splash.classList.add('hide');
    setTimeout(()=>splash&&splash.remove(),500);
  },2300);
});
</script>
